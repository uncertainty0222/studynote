<style>
/* 한 손 엄지로 쓰는 세로 한 열: 덱 칩 → 카드 → 큰 버튼 */
:root{
  --bg:#f3f6f4; --card:#ffffff; --ink:#1d2a26; --sub:#5d6e68; --line:#d7e1dc;
  --lotus:#c8456b; --jade:#2f7d62; --muted:#7d8a85;
  --ko:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --vi:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141c19; --card:#1e2925; --ink:#e8efec; --sub:#9fb0a9; --line:#2f3d38;
  --lotus:#e2789a; --jade:#4fae8b; --muted:#5f6d68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c19; --card:#1e2925; --ink:#e8efec; --sub:#9fb0a9; --line:#2f3d38;
  --lotus:#e2789a; --jade:#4fae8b; --muted:#5f6d68; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--vi)}
main{max-width:560px;margin:0 auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--ko);font-size:22px;margin:4px 0 0;text-wrap:balance}
h1 small{display:block;font-family:var(--vi);font-size:14px;font-weight:400;color:var(--sub);margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:14px var(--ko);cursor:pointer}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 11px;font:13px var(--ko);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:280px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none;gap:10px}
.big{font-size:27px;font-weight:700;line-height:1.45;text-wrap:balance}
.ko{font-family:var(--ko);font-weight:400}
.rr{color:var(--sub);font-size:15px}
.vi{font-size:18px}
.note{font-size:14px;color:var(--lotus)}
.num{font-size:13px;font-weight:600;color:var(--jade);font-variant-numeric:tabular-nums}
.hint{margin-top:8px;font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px}
.row button{flex:1;border:0;border-radius:14px;padding:15px 10px;font:600 16px var(--vi);color:var(--bg);cursor:pointer}
.prev{background:var(--muted)}.speed{flex:0 0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line)}.next{background:var(--jade)}.speak{background:var(--lotus)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--lotus);outline-offset:2px}
</style>
</head>

<div class="row">
  <button class="speak" id="speak">🔊 듣기 · Nghe</button>
  <button class="speed" id="speed"></button>
</div>
<div class="row">
  <button class="prev" id="prev">← 이전 · Trước</button>
  <button class="next" id="next">다음 → · Tiếp</button>
</div>
<div class="bar"><button id="order">순서대로 · Theo thứ tự</button><button id="shuffle">섞기 · Trộn thẻ</button></div>

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let deckId = store.get("deck", "all");
let viFirst = store.get("viFirst", true);
let queue = [], pos = 0, flipped = false;

const $ = id => document.getElementById(id);
const cardsOf = id => id === "all" ? DECKS.flatMap(d => d.cards) : DECKS.find(d => d.id === id).cards;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function build(mix = false) {
  queue = mix ? shuffle([...cardsOf(deckId)]) : [...cardsOf(deckId)];
  pos = 0; flipped = false;
  render();
}

function go(step) {
  pos = (pos + step + queue.length) % queue.length;
  flipped = false;
  render();
}

function render() {
  $("decks").innerHTML = "";
  [{ id: "all", ko: "전체 50 · Tất cả" }, ...DECKS].forEach(d => {
    const b = document.createElement("button");
    b.className = "chip" + (d.id === deckId ? " on" : "");
    b.textContent = d.ko;
    b.onclick = () => { deckId = d.id; store.set("deck", deckId); build(); };
    $("decks").appendChild(b);
  });
  $("count").textContent = `${pos + 1} / ${queue.length}`;
  $("mode").textContent = viFirst ? "베트남어 → 한국어" : "한국어 → 베트남어";
  const c = queue[pos];
  const num = `<div class="num">#${c.n}</div>`;
  const front = viFirst ? `<div class="big">${c.vi}</div>` : `<div class="big ko">${c.ko}</div><div class="rr">${c.rr}</div>`;
  const back = `<div class="big ko">${c.ko}</div><div class="rr">${c.rr}</div><div class="vi">${c.vi}</div>` + (c.note ? `<div class="note">${c.note}</div>` : "");
  $("card").innerHTML = num + (flipped ? back : front) + (flipped ? "" : `<div class="hint">눌러서 정답 보기 · Chạm để xem đáp án</div>`);
}

// lang만 지정하면 브라우저가 한국어가 아닌 기본 음성으로 읽는 경우가 있어 ko 음성을 직접 고른다.
function koVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.replace("_", "-").toLowerCase().startsWith("ko"));
  return vs.find(v => /natural|neural|online|google|premium|enhanced/i.test(v.name)) || vs[0] || null;
}

const SPEEDS = [1, 0.8, 0.6];
let speed = store.get("speed", 1);
const player = new Audio();

// 녹음 파일(audio/NN.mp3)을 먼저 틀고, 없거나 재생이 안 되면 기기 음성으로 읽는다.
function speak() {
  const c = queue[pos];
  if (!c) return;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  player.onerror = () => deviceSpeak(c);
  player.src = `audio/${String(c.n).padStart(2, "0")}.mp3`;
  player.playbackRate = speed;
  player.play().catch(() => {});
}

function deviceSpeak(c) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(c.ko.replace(/\//g, ","));
  u.lang = "ko-KR"; u.rate = 0.9 * speed;
  const v = koVoice(); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

$("card").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("card").click(); } };
$("card").onclick = () => { flipped = !flipped; render(); if (flipped) speak(); };
$("speak").onclick = speak;
$("speed").onclick = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  store.set("speed", speed); renderSpeed(); speak();
};
function renderSpeed() { $("speed").textContent = `속도 · Tốc độ ${speed}x`; }
if (!SPEEDS.includes(speed)) speed = 1;
renderSpeed();
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("mode").onclick = () => { viFirst = !viFirst; store.set("viFirst", viFirst); flipped = false; render(); };
$("shuffle").onclick = () => build(true);
$("order").onclick = () => build(false);
if ("speechSynthesis" in window) speechSynthesis.getVoices();
if (!DECKS.some(d => d.id === deckId)) deckId = "all";
