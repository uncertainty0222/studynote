<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나나 한국어 카드</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#222;--sub:#666;--accent:#d9534f;--ok:#2e8b57;--line:#e5e0d8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a19;--card:#2a2826;--ink:#eee;--sub:#aaa;--line:#3a3734}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px;color:var(--sub)}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:260px;padding:24px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.big{font-size:26px;font-weight:700;line-height:1.4}
.rr{color:var(--sub);margin-top:8px}
.vi{margin-top:12px;font-size:18px}
.note{margin-top:12px;font-size:14px;color:var(--accent)}
.hint{margin-top:16px;font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;color:#fff}
.again{background:#888}.known{background:var(--ok)}.speak{background:var(--accent)}
</style>
</head>
<body>
<main>
<h1>나나 한국어 카드 · Thẻ học tiếng Hàn</h1>
<div class="chips" id="decks"></div>
<div class="bar"><span id="count"></span><button id="mode"></button></div>
<div class="card" id="card"></div>
<div class="row">
  <button class="speak" id="speak">🔊 듣기 · Nghe</button>
</div>
<div class="row">
  <button class="again" id="again">다시 · Chưa thuộc</button>
  <button class="known" id="known">알아요 · Thuộc rồi</button>
</div>
<div class="bar"><span></span><button id="reset">처음부터 · Học lại</button></div>
</main>
<script>
const DECKS = /*DECKS*/[];
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let known = new Set(store.get("known", []));
let deckId = store.get("deck", "all");
let viFirst = store.get("viFirst", true);
let queue = [], flipped = false;

const $ = id => document.getElementById(id);
const cardsOf = id => id === "all" ? DECKS.flatMap(d => d.cards) : DECKS.find(d => d.id === id).cards;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function build() {
  queue = shuffle(cardsOf(deckId).filter(c => !known.has(c.ko)));
  flipped = false;
  render();
}

function render() {
  $("decks").innerHTML = "";
  [{ id: "all", ko: "전체 · Tất cả" }, ...DECKS].forEach(d => {
    const b = document.createElement("button");
    b.className = "chip" + (d.id === deckId ? " on" : "");
    b.textContent = d.ko;
    b.onclick = () => { deckId = d.id; store.set("deck", deckId); build(); };
    $("decks").appendChild(b);
  });
  const total = cardsOf(deckId).length;
  $("count").textContent = `남은 카드 · Còn lại: ${queue.length} / ${total}`;
  $("mode").textContent = viFirst ? "베트남어 → 한국어" : "한국어 → 베트남어";
  const c = queue[0];
  if (!c) { $("card").innerHTML = `<div class="big">🎉 다 외웠어요!</div><div class="vi">Thuộc hết rồi! Giỏi lắm!</div>`; return; }
  const front = viFirst ? `<div class="big">${c.vi}</div>` : `<div class="big">${c.ko}</div><div class="rr">${c.rr}</div>`;
  const back = `<div class="big">${c.ko}</div><div class="rr">${c.rr}</div><div class="vi">${c.vi}</div>` + (c.note ? `<div class="note">${c.note}</div>` : "");
  $("card").innerHTML = flipped ? back : front + `<div class="hint">눌러서 정답 보기 · Chạm để xem đáp án</div>`;
}

function speak() {
  const c = queue[0];
  if (!c || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(c.ko.replace(/\//g, ","));
  u.lang = "ko-KR"; u.rate = 0.85;
  speechSynthesis.speak(u);
}

$("card").onclick = () => { flipped = !flipped; render(); if (flipped) speak(); };
$("speak").onclick = speak;
$("again").onclick = () => { if (queue.length) { queue.push(queue.shift()); flipped = false; render(); } };
$("known").onclick = () => {
  const c = queue.shift(); if (!c) return;
  known.add(c.ko); store.set("known", [...known]); flipped = false; render();
};
$("mode").onclick = () => { viFirst = !viFirst; store.set("viFirst", viFirst); flipped = false; render(); };
$("reset").onclick = () => { cardsOf(deckId).forEach(c => known.delete(c.ko)); store.set("known", [...known]); build(); };
if (!DECKS.some(d => d.id === deckId)) deckId = "all";
build();
</script>
</body>
</html>
