<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>나나의 손님 응대 50문장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
@page{size:A4;margin:8mm 12mm}
:root{--ink:#1d2a26;--sub:#56665f;--line:#cfdcd6;--jade:#2f7d62;--lotus:#c8456b;
  --ko:"Gowun Dodum","Noto Sans KR",sans-serif;--vi:"Be Vietnam Pro",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#fff;font-family:var(--vi)}
.page{page-break-after:always}
.page:last-child{page-break-after:auto}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--jade);padding-bottom:2mm;margin-bottom:2mm}
h1{font-family:var(--ko);font-size:17pt;margin:0}
header span{font-size:9pt;color:var(--sub)}
h2{font-family:var(--ko);font-size:10.5pt;color:var(--jade);margin:2mm 0 0.5mm}
h2 small{font-family:var(--vi);font-weight:400;color:var(--sub);font-size:8.5pt}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:3mm;padding:0.55mm 0;border-bottom:0.3mm solid var(--line);break-inside:avoid}
.n{width:7mm;text-align:right;font-weight:600;font-size:10pt;color:var(--jade);font-variant-numeric:tabular-nums}
.box{width:3.6mm;height:3.6mm;border:0.35mm solid var(--sub);border-radius:0.6mm;flex:none}
.t{min-width:0}
.ko{font-family:var(--ko);font-size:12.5pt;line-height:1.15}
.sub{font-size:8pt;color:var(--sub);line-height:1.2}
.vi{color:var(--ink)}
.note{color:var(--lotus);margin-left:2mm}
</style>
</head>
<body>
<!--PAGES-->
</body>
</html>
